name: Publish Temporary Rock

on:
  pull_request:
    types: [ labeled ]

jobs:
  hotfix_publish:
    name: Publish hotfix release
    # Run only if 'hotfix' label is attached.
    if: ${{ github.event.label.name == 'hotfix' }}
    # Preserve the hosted-runner boundary for fork PRs.
    runs-on: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          'ubuntu-22.04' || 'self-hosted-linux-amd64-noble-medium' }}
    permissions:
      packages: write
    steps:
      - run: |
          echo Publishing container image for PR# $NUMBER
        env:
          NUMBER: ${{ github.event.pull_request.number }}

      - name: Checkout
        uses: actions/checkout@v3

      - name: Install hub
        run: sudo apt-get update && sudo apt-get install -y hub

      - name: Checkout Pull Request
        run: hub pr checkout ${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup LXD
        uses: canonical/setup-lxd@v0.1.1
        with:
          channel: 5.21/edge

      - name: Install deps and clean legacy rules.
        run: |
          sudo snap install docker
          sudo snap install rockcraft --classic --channel latest/edge
          for ipt in iptables iptables-legacy ip6tables ip6tables-legacy; do
            sudo $ipt --flush || true
            sudo $ipt --flush -t nat || true
            sudo $ipt --delete-chain || true
            sudo $ipt --delete-chain -t nat || true
            sudo $ipt -P FORWARD ACCEPT || true
            sudo $ipt -P INPUT ACCEPT || true
            sudo $ipt -P OUTPUT ACCEPT || true
          done
          sudo systemctl reload snap.lxd.daemon
          sleep 5

      - name: Patch PR information into rock recipe
        id: versioning
        shell: bash
        run: |
            sudo rockcraft pull pkg_info --verbosity=debug 2>&1 | tee "$RUNNER_TEMP/rockcraft-pull.log"
            # Debug output can include timestamps before apt's Version field.
            PKG_VER=$(awk '/(^|[[:space:]])Version:[[:space:]]/ {sub(/.*Version:[[:space:]]*/, ""); print $1; exit}' "$RUNNER_TEMP/rockcraft-pull.log")
            if [[ -z "$PKG_VER" ]]; then
              echo "::error::Could not determine ceph-common version; see the Rockcraft logs"
              exit 1
            fi
            CEPH_VER=$(cut -d'-' -f1 <<< "$PKG_VER")
            sed -i "/version:/c\version: $PR_NUM-$CEPH_VER" rockcraft.yaml
            echo "ceph_version=$CEPH_VER" >> "$GITHUB_OUTPUT"
        env:
          PR_NUM: ${{ github.event.pull_request.number }}

      - name: login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ghcr.io/canonical/ceph
          tags: |
            type=raw,value=hotfix-${{ github.event.pull_request.number }}-${{ steps.versioning.outputs.ceph_version }}
        
      - name: Prepare Rock
        uses: canonical/craft-actions/rockcraft-pack@main
        id: rockcraft
        with:
          verbosity: debug
      - name: Add cephadm image label
        run: scripts/add-oci-label ${{ steps.rockcraft.outputs.rock }} ceph True

      - name: Load to Docker daemon
        run: |
            # iterate through the tags
            for tag in $TAGS; do
              echo "$tag"
              docker image ls -a
              rockcraft.skopeo --insecure-policy copy oci-archive:${{ steps.rockcraft.outputs.rock }} docker-daemon:$tag
            done
            docker image ls -a
            sleep 10
            docker push ghcr.io/canonical/ceph --all-tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

      - name: Collect Rockcraft logs
        if: always()
        shell: bash
        run: |
          log_dir="$RUNNER_TEMP/rockcraft-diagnostics"
          mkdir -p "$log_dir"
          if [[ -f "$RUNNER_TEMP/rockcraft-pull.log" ]]; then
            cp "$RUNNER_TEMP/rockcraft-pull.log" "$log_dir/"
          fi
          # Rockcraft is invoked both directly with sudo and by craft-actions.
          for home in "$HOME" /root; do
            if sudo test -d "$home/.local/state/rockcraft/log"; then
              sudo cp -a "$home/.local/state/rockcraft/log" "$log_dir/$(basename "$home")"
            fi
          done
          sudo chown -R "$(id -u):$(id -g)" "$log_dir"

      - name: Upload Rockcraft logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotfix-rockcraft-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rockcraft-diagnostics
          if-no-files-found: warn
