[tox]
min_version = 4.0
env_list = key-rotation-dryrun

[testenv]
package = skip
deps = robotframework==7.3.2

[testenv:key-rotation-dryrun]
description = Validate Robot scenarios without executing cluster commands
commands = python -m robot --dryrun --outputdir {env_tmp_dir}/results {tox_root}/test/robot/key_rotation.robot

[testenv:key-rotation]
description = Deploy a single-node cluster and rotate service/client keys (disposable host, root required)
commands = python -m robot --exitonfailure --outputdir {env_tmp_dir}/results --variable CEPH_IMAGE:{env:CEPH_IMAGE:localhost:5000/canonical/ceph:latest} {tox_root}/test/robot/key_rotation.robot
