name: ceph
base: ubuntu@26.04
version: '0.1' # replaced by CI when building to publish.
summary: Ubuntu based Ceph container image
description: Rock for Containerised Ceph based on Ubuntu Ceph distribution.
license: Apache-2.0
platforms:
    amd64:

# Use the Ceph 20.2.4 Tentacle packages from the PPA used by MicroCeph's
# main branch. They are built for Resolute (26.04).
package-repositories:
  - type: apt
    ppa: lmlogiudice/ceph-lp2166817-updates
    priority: always

services:
    ceph-container:
        override: replace
        command: /opt/ceph-container/bin/pebble/pebble_cmd.sh
        summary: Unified Ceph container service started by the entrypoint
        startup: enabled

parts:
    # Workaround part which build nothing to fetch package info early in CI.
    pkg_info:
        plugin: nil
        override-pull: |
          apt info ceph-common

    ceph:
        plugin: nil
        overlay-packages:
            # Ceph packages
            - ceph-common 
            - ceph-mon 
            - ceph-osd
            - ceph-mds
            - ceph-mgr
            - ceph-mgr-cephadm
            - ceph-mgr-dashboard
            - ceph-mgr-diskprediction-local
            - ceph-mgr-k8sevents
            - ceph-mgr-rook
            - ceph-prometheus-alerts
            - ceph-grafana-dashboards
            - ceph-immutable-object-cache
            - radosgw
            - cephfs-mirror
            - ceph-iscsi
            - ceph-fuse
            - python3-rgw
            - rbd-nbd
            - rbd-mirror
            # Utilities
            - gnupg 
            - ca-certificates
            - curl
            - jq
            - kmod
            - lvm2
            - gdisk
            - smartmontools
            - e2fsprogs
            - nvme-cli
            - attr # utilities for manipulating filesystem extended attributes
            - targetcli-fb
            - uuid-runtime
            - python3-setuptools
            - udev
            - dmsetup
            - ceph-volume
            - python3-asyncssh
            - python3-natsort
            - sharutils
            - lsof
            - python3-onelogin-saml2
        overlay-script: |
            set -eu
            cd "${CRAFT_OVERLAY}"
            for p in "${CRAFT_PROJECT_DIR}"/patches/*.patch; do
              echo "Applying ${p}"
              # --forward + dry-run check makes incremental rebuilds safe:
              # if the patch is already applied (overlay cache survived
              # from a prior pack), skip it instead of failing.
              if patch -p1 --forward --dry-run --silent < "${p}" >/dev/null 2>&1; then
                patch -p1 --forward < "${p}"
              else
                echo "Patch ${p} appears already applied; skipping"
              fi
            done

    nfs-ganesha:
        plugin: nil
        after: [ceph]
        overlay-packages:
            - nfs-ganesha
            - nfs-ganesha-ceph
            - nfs-ganesha-rados-grace
            - nfs-ganesha-rgw
        overlay-script: |
            # Ubuntu's nfs-ganesha package relies on systemd's
            # RuntimeDirectory=ganesha to create /run/ganesha at service
            # start. Rook execs ganesha.nfsd directly inside the container
            # without systemd, so the dir never exists and ganesha.nfsd
            # FATALs writing its pidfile. Pre-create it here.
            install -d -m 0755 "${CRAFT_OVERLAY}/run/ganesha"

    kubectl:
        plugin: go
        build-snaps:
            - go
        source: ./kubectl
        source-type: local

    local-files:
        plugin: dump
        source: . # all local files
        organize:
            # Logrotate (required by Rook prod spec)
            logrotate.d/* : ${CRAFT_PART_INSTALL}/etc/logrotate.d/
            # Ceph defaults
            ceph.defaults : ${CRAFT_PART_INSTALL}/opt/ceph-container/etc/
